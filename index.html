<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Amazon | Futuristic Tech Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <a href="index.html" class="logo">⚡ MiniAmazon</a>
    <div class="nav-links">
      <a href="cart.html" class="cart-icon-btn">
        🛒 Cart <span id="cartBadge" class="cart-badge">0</span>
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <h1 class="section-title">Featured Tech Gadgets</h1>
    <div id="productGrid" class="product-grid">
      <!-- Dynamic Products Rendered Here -->
    </div>
  </main>

  <!-- Product Details Popup Modal -->
  <div id="productModal" class="modal-overlay">
    <div class="modal-content">
      <button id="closeModal" class="close-btn">&times;</button>
      <img id="modalImg" class="modal-img" src="" alt="Product Image">
      <div class="modal-details">
        <span id="modalCategory" class="category-tag">Category</span>
        <h2 id="modalTitle" class="product-title" style="font-size: 1.4rem;">Product Name</h2>
        <div id="modalRating" class="rating">★ 0.0</div>
        <p id="modalDescription" class="modal-description">Product description goes here.</p>
        <div class="card-footer">
          <span id="modalPrice" class="price">$0.00</span>
          <button id="modalAddBtn" class="btn-add">Add to Cart</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification Popup Container -->
  <div id="toastNotification" class="toast-notification">
    ⚡ <span id="toastMessage">Item added to cart!</span>
  </div>

 > <!-- JavaScript Files -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
